name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]" "mkpfs==0.0.9"
      - name: Compile all modules
        run: python -m compileall -q src tools
      - name: Test
        run: pytest -q
