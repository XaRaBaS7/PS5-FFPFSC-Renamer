name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "mkpfs==0.0.9" pyinstaller pillow

      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q src tools
          pytest -q

      - name: Generate application artwork
        shell: pwsh
        run: python tools/generate_app_icon.py

      - name: Build MkPFS helper
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name mkpfs-helper `
            --collect-all mkpfs `
            --hidden-import cryptography `
            --hidden-import zlib_ng `
            tools/mkpfs_helper.py
          .\dist\mkpfs-helper.exe --help

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name PS5-FFPFSC-Renamer `
            --icon assets/app-icon.ico `
            --paths src `
            --add-data "assets/brand;assets/brand" `
            --collect-submodules send2trash `
            tools/app_entry.py

      - name: Assemble package
        id: package
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Refusing stable release for non-final version '$version'. Expected X.Y.Z."
          }

          $app = ".\dist\PS5-FFPFSC-Renamer"
          Copy-Item ".\dist\mkpfs-helper.exe" "$app\mkpfs-helper.exe"
          Copy-Item ".\README.md" "$app\README.md"
          Copy-Item ".\LICENSE" "$app\LICENSE"
          Copy-Item ".\THIRD_PARTY_NOTICES.md" "$app\THIRD_PARTY_NOTICES.md"
          Copy-Item ".\CHANGELOG.md" "$app\CHANGELOG.md"

          # MkPFS is GPL-3.0. Preserve the exact source distribution used to
          # build the separate bundled helper.
          New-Item -ItemType Directory -Force "$app\source\third-party" | Out-Null
          python -m pip download --no-deps --no-binary=:all: "mkpfs==0.0.9" -d "$app\source\third-party"

          # Branding is already embedded by PyInstaller under _internal.
          if (Test-Path "$app\app-icon.png") { throw "Unexpected redundant app-icon.png in package root" }
          if (Test-Path "$app\assets") { throw "Unexpected redundant assets directory in package root" }

          $archive = ".\dist\PS5-FFPFSC-Renamer-v$version-Windows-x64.zip"
          Compress-Archive -Path "$app\*" -DestinationPath $archive -Force
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create tag and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $tag = "v$env:VERSION"
          $exists = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $exists) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "PS5 FFPFSC Renamer $tag"
            git push origin $tag
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $env:ARCHIVE --title "PS5 FFPFSC Renamer $tag" --notes-file RELEASE_NOTES.md
          } else {
            gh release upload $tag $env:ARCHIVE --clobber
          }
