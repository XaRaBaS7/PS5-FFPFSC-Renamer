name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "mkpfs==0.0.9" pyinstaller pillow

      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q src tools
          pytest -q

      - name: Generate application artwork
        shell: pwsh
        run: python tools/generate_app_icon.py

      - name: Build MkPFS helper
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name mkpfs-helper `
            --collect-all mkpfs `
            --hidden-import cryptography `
            --hidden-import zlib_ng `
            tools/mkpfs_helper.py
          .\dist\mkpfs-helper.exe --help

      - name: Smoke-test bounded MkPFS helper
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import json; p=Path('smoke-game/sce_sys'); p.mkdir(parents=True, exist_ok=True); (p/'param.json').write_text(json.dumps({'titleId':'PPSA01285','localizedParameters':{'defaultLanguage':'en-US','en-US':{'titleName':'CI Smoke'}}}), encoding='utf-8'); (p/'icon0.png').write_bytes(b'synthetic-icon')"
          mkpfs pack folder .\smoke-game .\smoke.ffpfsc --no-adjust-output-file-extension --skip-verification
          .\dist\mkpfs-helper.exe read-param-json .\smoke.ffpfsc .\smoke-param.json
          .\dist\mkpfs-helper.exe read-game-details .\smoke.ffpfsc .\smoke-details
          python -c "from pathlib import Path; import json; assert json.loads(Path('smoke-param.json').read_text(encoding='utf-8'))['titleId']=='PPSA01285'; assert json.loads(Path('smoke-details/sce_sys/param.json').read_text(encoding='utf-8'))['titleId']=='PPSA01285'; assert Path('smoke-details/sce_sys/icon0.png').read_bytes()==b'synthetic-icon'"

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name PS5-FFPFSC-Renamer `
            --icon assets/app-icon.ico `
            --paths src `
            --add-data "assets/brand;assets/brand" `
            --collect-submodules send2trash `
            tools/app_entry.py

      - name: Assemble package
        id: package
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[a-z]\d*)?$') {
            throw "Refusing release for unsupported version '$version'. Expected X.Y.Z or X.Y.Z<letter>[number]."
          }
          $isPrerelease = $version -notmatch '^\d+\.\d+\.\d+$'

          $app = ".\dist\PS5-FFPFSC-Renamer"
          Copy-Item ".\dist\mkpfs-helper.exe" "$app\mkpfs-helper.exe"
          Copy-Item ".\README.md" "$app\README.md"
          Copy-Item ".\LICENSE" "$app\LICENSE"
          Copy-Item ".\THIRD_PARTY_NOTICES.md" "$app\THIRD_PARTY_NOTICES.md"
          Copy-Item ".\CHANGELOG.md" "$app\CHANGELOG.md"

          # MkPFS is GPL-3.0. Preserve both the exact upstream source
          # distribution and the wrapper source used by mkpfs-helper.exe.
          New-Item -ItemType Directory -Force "$app\source\third-party" | Out-Null
          python -m pip download --no-deps --no-binary=:all: "mkpfs==0.0.9" -d "$app\source\third-party"
          Copy-Item ".\tools\mkpfs_helper.py" "$app\source\third-party\mkpfs_helper.py"

          # Branding is already embedded by PyInstaller under _internal.
          if (Test-Path "$app\app-icon.png") { throw "Unexpected redundant app-icon.png in package root" }
          if (Test-Path "$app\assets") { throw "Unexpected redundant assets directory in package root" }
          if (-not (Test-Path "$app\_internal\assets\brand")) { throw "Bundled brand assets are missing" }

          $package = ".\dist\PS5-FFPFSC-Renamer-v$version-Windows-x64"
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          Move-Item $app $package

          $archive = "$package.zip"
          Compress-Archive -Path $package -DestinationPath $archive -Force
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Create tag and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          $tag = "v$env:VERSION"
          $exists = git ls-remote --tags origin "refs/tags/$tag"

          # v0.5.0 is a historical immutable tag. Hotfix assets are uploaded to
          # the existing release without moving or recreating the tag.
          if ($tag -eq "v0.5.0") {
            $expectedCommit = "599bf32344c039d47593c135814744d3eec654a9"
            if (-not $exists) {
              throw "Historical tag v0.5.0 is missing. Refusing to recreate it on current main."
            }
            git fetch --force origin "refs/tags/v0.5.0:refs/tags/v0.5.0"
            $tagCommit = (git rev-list -n 1 "v0.5.0").Trim()
            if ($tagCommit -ne $expectedCommit) {
              throw "Historical tag v0.5.0 resolves to $tagCommit, expected $expectedCommit. Refusing release upload."
            }
          } elseif (-not $exists) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "PS5 FFPFSC Renamer $tag"
            git push origin $tag
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            if ($tag -eq "v0.5.0") {
              throw "Historical v0.5.0 release is missing. Refusing to create a replacement release."
            }
            if ($env:PRERELEASE -eq "true") {
              gh release create $tag $env:ARCHIVE --title "PS5 FFPFSC Renamer $tag" --notes-file RELEASE_NOTES.md --prerelease
            } else {
              gh release create $tag $env:ARCHIVE --title "PS5 FFPFSC Renamer $tag" --notes-file RELEASE_NOTES.md
            }
          } else {
            gh release upload $tag $env:ARCHIVE --clobber
          }
