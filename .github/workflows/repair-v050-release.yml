name: repair-v0.5.0-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-v050-release.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download current v0.5.0 asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repair
          gh release download v0.5.0 \
            --pattern "PS5-FFPFSC-Renamer-v0.5.0-Windows-x64.zip" \
            --dir repair
          sha256sum repair/PS5-FFPFSC-Renamer-v0.5.0-Windows-x64.zip

      - name: Apply startup and branding hotfix
        run: |
          python tools/repair_v050_release.py \
            repair/PS5-FFPFSC-Renamer-v0.5.0-Windows-x64.zip
          sha256sum repair/PS5-FFPFSC-Renamer-v0.5.0-Windows-x64.zip | tee repair/final.sha256

      - name: Replace asset in existing v0.5.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.5.0 \
            repair/PS5-FFPFSC-Renamer-v0.5.0-Windows-x64.zip \
            --clobber

      - name: Verify uploaded asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          local_sha=$(sha256sum repair/PS5-FFPFSC-Renamer-v0.5.0-Windows-x64.zip | awk '{print $1}')
          remote_digest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.5.0" \
            --jq '.assets[] | select(.name == "PS5-FFPFSC-Renamer-v0.5.0-Windows-x64.zip") | .digest')
          echo "local=sha256:${local_sha}"
          echo "remote=${remote_digest}"
          test "${remote_digest}" = "sha256:${local_sha}"
