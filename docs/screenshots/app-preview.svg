    <text x="990" y="404" fill="#746c82" font-size="8">Rename files where they are now; no folder moves.</text>
    <text x="260" y="450" fill="#c08ce8" font-size="8">Example: Old folder\Returnal.ffpfsc  →  PPSA01285 - Returnal - v1.0.ffpfsc</text>

